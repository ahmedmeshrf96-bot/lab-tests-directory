      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deep audit V143 Android V141 parity
        shell: python
        run: |
          from pathlib import Path
          import json
          r=Path('build_v143_windows/windows-system')
          pkg=json.loads((r/'package.json').read_text(encoding='utf-8'))
          assert pkg['version']=='143.0.0'
          assert 'V143' in pkg['build']['portable']['artifactName']
          assert 'V143' in pkg['build']['nsis']['artifactName']
          tests=json.loads((r/'public/lab_tests_android.json').read_text(encoding='utf-8'))
          assert len(tests)==331
          assert all(x.get('customer_price') is None for x in tests)
          data=(r/'src/data.js').read_text(encoding='utf-8')
          for x in ["catalog:'lab_catalog_overrides'",'applyCatalogOverrides','loadCatalog(baseTests','watchCatalog(baseTests','saveCatalogOverride','nextCatalogId','canonicalTestDocId','watchOverrides','saveCustomerPricesBulk','docId=canonicalTestDocId(id)','requestResultRevision','resetUserLoginCredentials',"customers:'customers'","labOrders:'lab_orders'"]:
            assert x in data, x
          assert "doc(pdb,C.overrides,String(testId))" not in data
          backup=(r/'src/backup.js').read_text(encoding='utf-8')
          for x in ["app_version_code:143","app_version_name:'System V143 Windows'",'getDocFromServer','Existing Firestore documents are NEVER overwritten','if(!snap.exists())missing.push(write)']:
            assert x in backup, x
          assert backup.count('lab_catalog_overrides') >= 2
          app=(r/'src/app.js').read_text(encoding='utf-8')
          for x in ['Unified System V143','Windows V143','V143 Android V141 Final Parity','D.loadCatalog(baseTests)','D.watchCatalog(baseTests','D.watchOverrides(','addCatalogTest','D.saveCatalogOverride','D.nextCatalogId','bulkPriceEdit','D.saveCustomerPricesBulk','Supabase Shadow Backup V143:','Backup مشفر V143','Safe Restore V143','تم الاسترجاع ✓']:
            assert x in app, x
          main=(r/'electron/main.cjs').read_text(encoding='utf-8')
          for x in ["appVersionCode: 143, appVersionName: 'Windows V143'","tray.setToolTip('تحاليل العقاد — Windows V143')",'latest-windows.json','MAX_WINDOWS_UPDATE_BYTES','downloadWindowsUpdate','sha256FileAsync','scheduleWindowsUpdateCheck',"FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-failover-read'","RESULT_FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-result-failover'","RECONCILE_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-shadow-reconcile'",'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000','target.setHours(4,0,0,0)','safeStorage.encryptString','setLoginItemSettings','sandbox: true','contextIsolation: true','nodeIntegration: false','webSecurity: true','setContentProtection(false)']:
            assert x in main, x
          assert 'setContentProtection(true)' not in main
          assert "appVersionCode: 129, appVersionName: 'Windows V129'" not in main
          shadow=(r/'src/shadowBackup.js').read_text(encoding='utf-8')
          for x in ['tahalil-shadow-mirror','appVersionCode: 143',"appVersionName: 'Windows V143'",'Shadow backup is deliberately non-blocking']:
            assert x in shadow, x
          fail=(r/'src/failover.js').read_text(encoding='utf-8')
          assert 'tahalil-failover-read' in fail and 'getIdToken(false)' in fail and 'getIdToken(true)' in fail
          result=(r/'src/resultFailover.js').read_text(encoding='utf-8')
          assert 'tahalil-result-failover' in result and 'result_hash_mismatch' in result and 'MAX_FILE_BYTES' in result
          rec=(r/'src/shadowReconcile.js').read_text(encoding='utf-8')
          assert 'tahalil-shadow-reconcile' in rec and 'SUCCESS_INTERVAL_MS=24*60*60*1000' in rec and 'runIfDue' in rec
          files=['src/app.js','src/data.js','src/backup.js','src/shadowBackup.js','src/failover.js','src/resultFailover.js','src/shadowReconcile.js','electron/main.cjs','electron/preload.cjs']
          combined='\n'.join((r/f).read_text(encoding='utf-8',errors='ignore') for f in files)
          low=combined.lower()
          assert 'cloudflare' not in low and 'workers.dev' not in low
          assert 'sendpasswordresetemail' not in low
          for secret in ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY']:
            assert secret not in combined, secret
          for stale in ['Unified System V142','Windows V142','Backup مشفر V142','Safe Restore V142','Supabase Shadow Backup V129:']:
            assert stale not in combined, stale
          print('WINDOWS V143 FINAL PARITY AUDIT PASSED')

      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'build_v143_windows/windows-system'
          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

      - name: Install dependencies
        working-directory: build_v143_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v143_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v143_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE missing' }
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v143_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: Background startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v143_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $p=Start-Process $exe.FullName -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Background startup exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Build Setup
        working-directory: build_v143_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare delivery files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v143_windows/windows-system/release'
          $portable=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup=Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Setup/Portable missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V143-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V143-Windows-Setup.exe' -Force
          Copy-Item 'v143-source.zip' 'Tahalil-Alakkad-V143-Windows-SOURCE.zip' -Force
          foreach ($name in @('Tahalil-Alakkad-V143-Windows-Portable.exe','Tahalil-Alakkad-V143-Windows-Setup.exe','Tahalil-Alakkad-V143-Windows-SOURCE.zip')) {
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Upload V143 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-Windows-V143-FINAL-PARITY
          path: |
            Tahalil-Alakkad-V143-Windows-Portable.exe
            Tahalil-Alakkad-V143-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V143-Windows-Setup.exe
            Tahalil-Alakkad-V143-Windows-Setup.exe.sha256
            Tahalil-Alakkad-V143-Windows-SOURCE.zip
            Tahalil-Alakkad-V143-Windows-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows V143 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v143-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "تحاليل العقاد Windows V143 — Android V141 Final Parity" --notes "Windows V143 closes final Android V141 parity gaps. It adds Firebase lab_catalog_overrides realtime sync, manager add/edit/delete for the shared test catalogue, encrypted backup/restore coverage for the shared catalogue, realtime customer-price sync, canonical test_<id> price document writes matching Android, and server-backed bulk customer-price updates. It also cleans stale Windows shadow/version metadata. Firebase remains authoritative; V139 resilience, result fallback, reconciliation, V137 04:00 auto backup, 72h protected offline mode, results/revision, notifications, screenshots, tray, verified SHA-256 auto update and hardened Electron are preserved. No Cloudflare, no Supabase secret, no reset-email flow."
            if ($LASTEXITCODE -ne 0) { throw 'Release create failed' }
          }
          gh release upload $tag `
            'Tahalil-Alakkad-V143-Windows-Portable.exe' `
            'Tahalil-Alakkad-V143-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V143-Windows-Setup.exe' `
            'Tahalil-Alakkad-V143-Windows-Setup.exe.sha256' `
            'Tahalil-Alakkad-V143-Windows-SOURCE.zip' `
            'Tahalil-Alakkad-V143-Windows-SOURCE.zip.sha256' `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --latest

      - name: Final status
        shell: pwsh
        run: Write-Host 'WINDOWS V143 FINAL PARITY BUILT, SMOKE-TESTED AND RELEASED'
