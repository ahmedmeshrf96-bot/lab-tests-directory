name: Windows V144 Final Delivery Channel Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-v144:
    name: Build + Audit + Release Windows V144
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct audited V144 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base64=@'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          '@
          [IO.File]::WriteAllBytes('v144-source.zip',[Convert]::FromBase64String(($base64 -replace '\s','')))
          if (Test-Path build_v144_windows) { Remove-Item build_v144_windows -Recurse -Force }
          Expand-Archive 'v144-source.zip' 'build_v144_windows' -Force
          if (!(Test-Path 'build_v144_windows/windows-system/package.json')) { throw 'V144 source reconstruction failed' }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deep audit V144 final delivery channel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'build_v144_windows/windows-system'
          $pkg=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '144.0.0') { throw 'Expected Windows V144 package' }
          if ($pkg.build.portable.artifactName -notmatch 'V144') { throw 'Portable V144 artifact name missing' }
          if ($pkg.build.nsis.artifactName -notmatch 'V144') { throw 'Setup V144 artifact name missing' }

          $tests=Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if ($tests.Count -ne 331) { throw "Expected 331 tests, got $($tests.Count)" }
          if (($tests | Where-Object { $null -ne $_.customer_price }).Count -ne 0) { throw 'Embedded customer prices detected' }

          $data=Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach ($x in @(
            'lab_catalog_overrides',
            'watchCatalog',
            'saveCatalogOverride',
            'saveCustomerPricesBulk',
            'test_',
            'requestResultRevision',
            'resetUserLoginCredentials'
          )) { if(!$data.Contains($x)){throw "Missing Android V141 parity marker: $x"} }

          $backup=Get-Content (Join-Path $root 'src/backup.js') -Raw
          foreach ($x in @('const SCHEMA=3','app_version_code:144',"app_version_name:'System V144 Windows'",'lab_catalog_overrides','getDocFromServer','if(!snap.exists())missing.push(write)')) {
            if(!$backup.Contains($x)){throw "Missing V144 backup marker: $x"}
          }

          $shadow=Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach ($x in @('tahalil-shadow-mirror','appVersionCode: 144',"appVersionName: 'Windows V144'",'Shadow backup is deliberately non-blocking')) {
            if(!$shadow.Contains($x)){throw "Missing V144 shadow marker: $x"}
          }

          $appjs=Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach ($x in @('Unified System V144','Windows V144','Supabase Shadow Backup V144:','Backup مشفر V144','Safe Restore V144','watchCatalog','watchOverrides','saveCustomerPricesBulk','تم الاسترجاع ✓')) {
            if(!$appjs.Contains($x)){throw "Missing V144 UI/parity marker: $x"}
          }

          $main=Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          $newChannel="https://github.com/ahmedmeshrf96-bot/lab-tests-directory/releases/latest/download/latest-windows.json"
          $oldChannel="https://github.com/ahmedmeshrf22-jpg/tahalil-alakkad-updates/releases/latest/download/latest-windows.json"
          foreach ($x in @(
            $newChannel,
            "appVersionCode: 144, appVersionName: 'Windows V144'",
            "tray.setToolTip('تحاليل العقاد — Windows V144')",
            'MAX_WINDOWS_UPDATE_BYTES',
            'downloadWindowsUpdate',
            'sha256FileAsync',
            'scheduleWindowsUpdateCheck',
            "original.hostname.toLowerCase() !== 'github.com'",
            "FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-failover-read'",
            "RESULT_FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-result-failover'",
            "RECONCILE_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-shadow-reconcile'",
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000',
            'target.setHours(4,0,0,0)',
            'safeStorage.encryptString',
            'setLoginItemSettings',
            'new Tray',
            'requestSingleInstanceLock',
            'sandbox: true',
            'contextIsolation: true',
            'nodeIntegration: false',
            'webSecurity: true',
            'setContentProtection(false)'
          )) { if(!$main.Contains($x)){throw "Missing V144 main marker: $x"} }
          if($main.Contains($oldChannel)){throw 'Old GitHub update channel still present'}
          if($main.Contains('setContentProtection(true)')){throw 'Screenshot blocking reappeared'}

          $fail=Get-Content (Join-Path $root 'src/failover.js') -Raw
          foreach ($x in @('tahalil-failover-read','getIdToken(false)','getIdToken(true)','shadow_read_only')) { if(!$fail.Contains($x)){throw "Missing failover marker: $x"} }
          $resultFail=Get-Content (Join-Path $root 'src/resultFailover.js') -Raw
          foreach ($x in @('tahalil-result-failover','MAX_FILE_BYTES','result_hash_mismatch')) { if(!$resultFail.Contains($x)){throw "Missing result failover marker: $x"} }
          $reconcile=Get-Content (Join-Path $root 'src/shadowReconcile.js') -Raw
          foreach ($x in @('tahalil-shadow-reconcile','SUCCESS_INTERVAL_MS=24*60*60*1000','runIfDue')) { if(!$reconcile.Contains($x)){throw "Missing reconcile marker: $x"} }

          $files=@('src/app.js','src/data.js','src/backup.js','src/shadowBackup.js','src/failover.js','src/resultFailover.js','src/shadowReconcile.js','electron/main.cjs','electron/preload.cjs')
          $combined=($files | ForEach-Object { Get-Content (Join-Path $root $_) -Raw }) -join "`n"
          $low=$combined.ToLowerInvariant()
          if($low.Contains('cloudflare') -or $low.Contains('workers.dev')){throw 'Cloudflare dependency detected'}
          if($low.Contains('sendpasswordresetemail')){throw 'Email password reset reappeared'}
          foreach($secret in @('SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY')){if($combined.Contains($secret)){throw "Forbidden secret marker: $secret"}}

          Write-Host 'WINDOWS V144 FINAL DELIVERY CHANNEL AUDIT PASSED'

      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'build_v144_windows/windows-system'
          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs syntax failed' }
          node --check (Join-Path $root 'electron/preload.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs syntax failed' }

      - name: Install dependencies
        working-directory: build_v144_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Build Portable
        working-directory: build_v144_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run dist:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v144_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw 'Portable EXE missing' }
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Portable smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Portable smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v144_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if (!$p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; throw 'Tray smoke timed out' }
          if ($p.ExitCode -ne 0) { throw "Tray smoke exit code $($p.ExitCode)" }
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: Background startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v144_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $p=Start-Process $exe.FullName -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Background startup exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Build Setup
        working-directory: build_v144_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run dist:setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed' }

      - name: Prepare V144 delivery and update manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v144_windows/windows-system/release'
          $portable=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup=Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$portable -or !$setup) { throw 'Setup/Portable missing' }
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V144-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V144-Windows-Setup.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-Windows-LATEST-Setup.exe' -Force
          Copy-Item 'v144-source.zip' 'Tahalil-Alakkad-V144-Windows-SOURCE.zip' -Force
          foreach ($name in @('Tahalil-Alakkad-V144-Windows-Portable.exe','Tahalil-Alakkad-V144-Windows-Setup.exe','Tahalil-Alakkad-Windows-LATEST-Setup.exe','Tahalil-Alakkad-V144-Windows-SOURCE.zip')) {
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }
          $setupSha=(Get-FileHash 'Tahalil-Alakkad-V144-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            versionCode=144
            versionName='Windows V144 Final Delivery Channel Fix'
            setupUrl='https://github.com/ahmedmeshrf96-bot/lab-tests-directory/releases/download/v144-windows/Tahalil-Alakkad-V144-Windows-Setup.exe'
            sha256=$setupSha
            mandatory=$true
          }
          $manifest | ConvertTo-Json | Set-Content 'latest-windows.json' -Encoding utf8
          $check=Get-Content 'latest-windows.json' -Raw | ConvertFrom-Json
          if($check.versionCode -ne 144 -or $check.sha256 -ne $setupSha){throw 'Manifest verification failed'}

      - name: Upload V144 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-Windows-V144-FINAL-DELIVERY
          path: |
            Tahalil-Alakkad-V144-Windows-Portable.exe
            Tahalil-Alakkad-V144-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V144-Windows-Setup.exe
            Tahalil-Alakkad-V144-Windows-Setup.exe.sha256
            Tahalil-Alakkad-Windows-LATEST-Setup.exe
            Tahalil-Alakkad-Windows-LATEST-Setup.exe.sha256
            Tahalil-Alakkad-V144-Windows-SOURCE.zip
            Tahalil-Alakkad-V144-Windows-SOURCE.zip.sha256
            latest-windows.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows V144 release and new update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v144-windows'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v144-windows already exists; refusing overwrite' }
          gh release create $tag `
            'Tahalil-Alakkad-V144-Windows-Portable.exe' `
            'Tahalil-Alakkad-V144-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V144-Windows-Setup.exe' `
            'Tahalil-Alakkad-V144-Windows-Setup.exe.sha256' `
            'Tahalil-Alakkad-Windows-LATEST-Setup.exe' `
            'Tahalil-Alakkad-Windows-LATEST-Setup.exe.sha256' `
            'Tahalil-Alakkad-V144-Windows-SOURCE.zip' `
            'Tahalil-Alakkad-V144-Windows-SOURCE.zip.sha256' `
            'latest-windows.json' `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "تحاليل العقاد Windows V144 — Final Delivery Channel Fix" `
            --notes "V144 preserves all V143 Android V141 parity and moves the Windows verified auto-update channel from the old GitHub account to ahmedmeshrf96-bot/lab-tests-directory. Firebase data, shared catalogue, prices, results, failover, reconciliation, encrypted 04:00 backup, offline mode, screenshots, tray and Electron hardening are unchanged. Android V141 is untouched." `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'V144 release create failed' }

      - name: Verify V144 public Windows update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 3
          $url="https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest-windows.json"
          curl.exe --fail --location --retry 3 $url -o public-latest-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public latest-windows.json' }
          $m=Get-Content public-latest-windows.json -Raw | ConvertFrom-Json
          if($m.versionCode -ne 144){throw "Public channel version is $($m.versionCode), expected 144"}
          if($m.versionName -ne 'Windows V144 Final Delivery Channel Fix'){throw 'Public versionName mismatch'}
          if($m.mandatory -ne $true){throw 'Public update must be mandatory'}
          if($m.setupUrl -ne 'https://github.com/ahmedmeshrf96-bot/lab-tests-directory/releases/download/v144-windows/Tahalil-Alakkad-V144-Windows-Setup.exe'){throw 'Public setupUrl mismatch'}
          $localSha=(Get-FileHash 'Tahalil-Alakkad-V144-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($m.sha256 -ne $localSha){throw 'Public SHA256 mismatch'}
          $assets=gh release view v144-windows --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          foreach($needed in @('Tahalil-Alakkad-V144-Windows-Setup.exe','Tahalil-Alakkad-V144-Windows-Portable.exe','Tahalil-Alakkad-V144-Windows-SOURCE.zip','latest-windows.json')){
            if($assets -notcontains $needed){throw "Missing release asset: $needed"}
          }
          Write-Host 'WINDOWS V144 PUBLIC UPDATE CHANNEL VERIFIED'

      - name: Final status
        shell: pwsh
        run: Write-Host 'WINDOWS V144 FINAL DELIVERY BUILT, SMOKE-TESTED, RELEASED AND UPDATE CHANNEL VERIFIED'
