name: Windows V146 Android V144 R3 Full Parity No Re-Lock R4 AUDITED

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahalil-windows-v146-android-v144-r3-no-relock-r4
  cancel-in-progress: false

jobs:
  windows-v146:
    name: Build + Audit + Release Windows V146
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WINDOWS_V145_SOURCE_SHA256: "1afd999a4a1da9b66580f2af265c42b4a6fa4a1291b656aa87bbb746c2b9401d"
      ANDROID_V144_SHA: "cb81e5608a02103b5d4633063b44fffd21e082da"

    steps:
      - name: Checkout Windows delivery repository
        uses: actions/checkout@v4

      - name: Preflight V146 destination
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Accept='application/vnd.github+json'
            Authorization="Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='Tahalil-Windows-V146-Preflight'
          }
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v146-windows"
          $response=Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          $status=[int]$response.StatusCode
          if($status -eq 200){throw 'Release v146-windows already exists; refusing overwrite'}
          if($status -ne 404){throw "Could not verify V146 release destination; GitHub API HTTP $status"}
          Write-Host 'V146 release destination is free (verified HTTP 404).'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct exact green Windows V145 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url="https://github.com/$env:GITHUB_REPOSITORY/releases/download/v145-windows/Tahalil-Alakkad-V145-Windows-SOURCE.zip"
          curl.exe --fail --location --retry 4 --retry-delay 2 $url -o v145-source.zip
          if($LASTEXITCODE -ne 0){throw 'Could not download exact Windows V145 source'}
          $actual=(Get-FileHash v145-source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $env:WINDOWS_V145_SOURCE_SHA256){throw "Windows V145 source SHA mismatch: $actual"}
          Remove-Item extracted_v145 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build_v146_windows -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path v145-source.zip -DestinationPath extracted_v145 -Force
          $pkg=Get-ChildItem extracted_v145 -Recurse -Filter package.json -File |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            Select-Object -First 1
          if(!$pkg){throw 'package.json not found in exact Windows V145 source'}
          $srcRoot=$pkg.Directory.FullName
          $dest=Join-Path $PWD 'build_v146_windows/windows-system'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Get-ChildItem -LiteralPath $srcRoot -Force | Copy-Item -Destination $dest -Recurse -Force
          if(!(Test-Path (Join-Path $dest 'package.json'))){throw 'Windows V145 reconstruction failed'}
          Write-Host 'Exact Windows V145 source reconstructed and SHA verified.'

      - name: Fetch immutable Android V144 R3 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base="https://raw.githubusercontent.com/ahmedmeshrf22-jpg/lab-tests-directory/$env:ANDROID_V144_SHA"
          curl.exe --fail --location --retry 4 "$base/app/build.gradle.kts" -o android-v144-build.gradle.kts
          if($LASTEXITCODE -ne 0){throw 'Could not fetch Android V144 build metadata'}
          curl.exe --fail --location --retry 4 "$base/app/src/main/java/com/example/MainActivity.kt" -o android-v144-main.kt
          if($LASTEXITCODE -ne 0){throw 'Could not fetch Android V144 MainActivity'}
          curl.exe --fail --location --retry 4 "$base/app/src/main/java/com/example/data/repository/LabTestRepository.kt" -o android-v144-repository.kt
          if($LASTEXITCODE -ne 0){throw 'Could not fetch Android V144 repository'}
          curl.exe --fail --location --retry 4 "$base/app/src/main/java/com/example/util/CommercialBackupManager.kt" -o android-v144-backup.kt
          if($LASTEXITCODE -ne 0){throw 'Could not fetch Android V144 backup manager'}
          curl.exe --fail --location --retry 4 "$base/app/src/main/assets/lab_tests_android.json" -o android-v144-catalog.json
          if($LASTEXITCODE -ne 0){throw 'Could not fetch Android V144 catalogue'}

      - name: Verify Android V144 R3 final baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $grad=Get-Content android-v144-build.gradle.kts -Raw
          if(!$grad.Contains('versionCode = 144')){throw 'Android source is not V144'}
          if(!$grad.Contains('versionName = "5.64-no-relock-v144-r3"')){throw 'Android V144 R3 versionName mismatch'}
          $main=Get-Content android-v144-main.kt -Raw
          foreach($x in @('mutableStateOf(auth.currentUser != null)','V144_R3_NO_RELOCK','viewModel.lockAdmin()')){
            if(!$main.Contains($x)){throw "Android V144 no-relock marker missing: $x"}
          }
          if($main.Contains('DisposableEffect(lifecycleOwner, appSettings.securityEnabled, appSettings.autoLockSeconds')){
            throw 'Old Android lifecycle re-lock block unexpectedly present'
          }
          $repo=Get-Content android-v144-repository.kt -Raw
          if(!$repo.Contains('V142 semantic organ/system search')){throw 'Android organ/system search baseline missing'}
          $backup=Get-Content android-v144-backup.kt -Raw
          if(!$backup.Contains('security_archive_warnings')){throw 'Android V143/V144 backup permission fix missing'}
          $tests=Get-Content android-v144-catalog.json -Raw | ConvertFrom-Json
          if($tests.Count -ne 331){throw "Expected 331 Android tests, got $($tests.Count)"}
          Write-Host 'Android V144 R3 baseline verified.'

      - name: Apply Windows V146 parity + no automatic re-lock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import json, re, shutil

          root=Path('build_v146_windows/windows-system')

          pkg_path=root/'package.json'
          pkg=json.loads(pkg_path.read_text(encoding='utf-8-sig'))
          if str(pkg.get('version'))!='145.0.0':
              raise SystemExit(f"Expected Windows V145 package, got {pkg.get('version')}")
          pkg['version']='146.0.0'
          build=pkg.setdefault('build',{})
          for key in ('portable','nsis'):
              target=build.get(key)
              if isinstance(target,dict) and isinstance(target.get('artifactName'),str):
                  target['artifactName']=target['artifactName'].replace('V145','V146')
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          lock_path=root/'package-lock.json'
          if lock_path.exists():
              lock=json.loads(lock_path.read_text(encoding='utf-8-sig'))
              if lock.get('version')=='145.0.0':
                  lock['version']='146.0.0'
              packs=lock.get('packages')
              if isinstance(packs,dict) and isinstance(packs.get(''),dict) and packs[''].get('version')=='145.0.0':
                  packs['']['version']='146.0.0'
              lock_path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for rel in ('src/backup.js','src/shadowBackup.js','src/app.js','electron/main.cjs'):
              p=root/rel
              text=p.read_text(encoding='utf-8')
              if 'V145' not in text:
                  raise SystemExit(f'Expected V145 marker missing in {rel}')
              p.write_text(text.replace('V145','V146'),encoding='utf-8')

          numeric_bumps={
              'src/backup.js':('app_version_code:145','app_version_code:146'),
              'src/shadowBackup.js':('appVersionCode: 145','appVersionCode: 146'),
              'electron/main.cjs':('appVersionCode: 145','appVersionCode: 146'),
          }
          for rel,(old,new) in numeric_bumps.items():
              p=root/rel
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'Expected one numeric V145 marker in {rel}, found {text.count(old)}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          app_path=root/'src/app.js'
          app=app_path.read_text(encoding='utf-8')

          # V146 mirrors Android V144 R3 behavior:
          # returning from background must NOT show the local app PIN overlay.
          # Admin elevation still locks when the app backgrounds.
          old_bg="window.tahalilNative?.onBackgrounded?.(()=>{try{lockApp()}catch{};lockAdminSession(true).catch(()=>{});"
          new_bg="window.tahalilNative?.onBackgrounded?.(()=>{lockAdminSession(true).catch(()=>{});"
          if app.count(old_bg)!=1:
              raise SystemExit(f'Expected one native background re-lock marker, found {app.count(old_bg)}')
          app=app.replace(old_bg,new_bg,1)

          arm_pattern=re.compile(r"function armAutoLock\(\)\{.*?\}\nfunction lockApp\(\)",re.S)
          app,n=arm_pattern.subn(
              "function armAutoLock(){if(lockTimer)clearTimeout(lockTimer);lockTimer=null}\nfunction lockApp()",
              app,
              count=1
          )
          if n!=1:
              raise SystemExit('Could not disable automatic inactivity re-lock exactly once')

          old_blur="window.addEventListener('blur',()=>{const s=getSettings();if(s.pinHash&&Number(s.autoLockMinutes)===-1)lockApp()});"
          if app.count(old_blur)!=1:
              raise SystemExit(f'Expected one blur re-lock marker, found {app.count(old_blur)}')
          app=app.replace(old_blur,"window.addEventListener('blur',()=>{});",1)

          marker="/* V146_ANDROID_V144_R3_NO_RELOCK: signed-in Windows session stays open on background/return; admin elevation still locks. */\n"
          anchor="window.tahalilNative?.onBackgrounded?.(()=>{lockAdminSession(true).catch(()=>{});"
          if anchor not in app:
              raise SystemExit('Patched background anchor missing')
          app=app.replace(anchor,marker+anchor,1)
          app_path.write_text(app,encoding='utf-8')

          # Android V144 carries the exact latest 331-test catalogue/search aliases.
          catalog_src=Path('android-v144-catalog.json')
          catalog_dst=root/'public/lab_tests_android.json'
          tests=json.loads(catalog_src.read_text(encoding='utf-8-sig'))
          if len(tests)!=331:
              raise SystemExit(f'Expected 331 Android V144 tests, got {len(tests)}')
          if any(t.get('customer_price') not in (None,'') for t in tests):
              raise SystemExit('Android catalogue unexpectedly embeds customer prices')
          # Preserve the exact Android catalogue bytes. Re-serializing JSON on Windows can change line endings
          # and would make the later SHA256 byte-parity audit fail even when the data is identical.
          shutil.copyfile(catalog_src,catalog_dst)

          notes=(
              'Windows V146 — Android V144 R3 Full Parity / No Automatic Re-Lock\n'
              'Base: exact public Windows V145 source release, SHA256 verified.\n'
              'Android baseline: exact V144 R3 commit cb81e5608a02103b5d4633063b44fffd21e082da.\n'
              'Automatic local app PIN re-lock on native background, window blur and inactivity is disabled.\n'
              'Explicit account Logout remains unchanged. Manager/Admin elevation still locks on background.\n'
              'Android V144 331-test catalogue/search aliases copied byte-for-data parity.\n'
              'Firebase shared catalogue/prices/orders/results and Supabase failover/reconciliation remain unchanged.\n'
          )
          (root/'V146_ANDROID_V144_R3_PARITY_NO_RELOCK_NOTES.txt').write_text(notes,encoding='utf-8')
          print(notes)
          '@ | Set-Content apply_v146.py -Encoding utf8
          python apply_v146.py
          if($LASTEXITCODE -ne 0){throw 'Windows V146 parity/no-relock patch failed'}

      - name: Deep audit Windows V146 linkage and preservation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'build_v146_windows/windows-system'
          $pkg=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if($pkg.version -ne '146.0.0'){throw 'Expected Windows V146 package'}
          if($pkg.build.portable.artifactName -notmatch 'V146'){throw 'Portable V146 artifact name missing'}
          if($pkg.build.nsis.artifactName -notmatch 'V146'){throw 'Setup V146 artifact name missing'}

          $androidCatalogHash=(Get-FileHash android-v144-catalog.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $windowsCatalogHash=(Get-FileHash (Join-Path $root 'public/lab_tests_android.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($androidCatalogHash -ne $windowsCatalogHash){throw 'Windows catalogue is not byte-identical to Android V144 catalogue'}
          $tests=Get-Content (Join-Path $root 'public/lab_tests_android.json') -Raw | ConvertFrom-Json
          if($tests.Count -ne 331){throw "Expected 331 tests, got $($tests.Count)"}
          $embeddedPrices=@($tests | Where-Object { $null -ne $_.customer_price -and [string]$_.customer_price -ne '' })
          if($embeddedPrices.Count -ne 0){throw "Embedded customer prices detected: $($embeddedPrices.Count)"}
          $heart=@('CK-MB','Troponin I (Qualitative)','Troponin I (Quantitative)','Homocysteine','CRP','LDH (Lactate Dehydrogenase)','Cholesterol','HDL','LDL Cholesterol','Triglyceride')
          foreach($name in $heart){
            $t=$tests | Where-Object { $_.english_name -eq $name } | Select-Object -First 1
            if(!$t){throw "Heart test missing: $name"}
            if(!([string]$t.search_text).Contains('القلب')){throw "Heart organ alias missing: $name"}
          }

          $app=Get-Content (Join-Path $root 'src/app.js') -Raw
          foreach($x in @('V146_ANDROID_V144_R3_NO_RELOCK','Unified System V146','Windows V146','lockAdminSession(true)')){
            if(!$app.Contains($x)){throw "V146 app marker missing: $x"}
          }
          if($app.Contains('setTimeout(lockApp')){throw 'Automatic inactivity lock still active'}
          if($app.Contains("onBackgrounded?.(()=>{try{lockApp()")){throw 'Native background still locks the whole app'}
          if($app.Contains("autoLockMinutes)===-1)lockApp()")){throw 'Window blur still locks the whole app'}
          if(!$app.Contains('id="lockNow"') -or !$app.Contains('else lockApp()')){throw 'Explicit manual lock control unexpectedly removed'}
          if(!$app.Contains('id="logout"') -or !$app.Contains('D.logout()')){throw 'Explicit Windows Logout path missing'}
          if($app.ToLowerInvariant().Contains('sendpasswordresetemail')){throw 'Email password reset path unexpectedly present'}

          $data=Get-Content (Join-Path $root 'src/data.js') -Raw
          foreach($x in @('lab_catalog_overrides','watchCatalog','saveCatalogOverride','saveCustomerPricesBulk','test_','requestResultRevision','resetUserLoginCredentials')){
            if(!$data.Contains($x)){throw "Shared Android/Windows data marker missing: $x"}
          }

          $backup=Get-Content (Join-Path $root 'src/backup.js') -Raw
          foreach($x in @('const SCHEMA=3','app_version_code:146',"app_version_name:'System V146 Windows'",'lab_catalog_overrides','getDocFromServer','if(!snap.exists())missing.push(write)')){
            if(!$backup.Contains($x)){throw "Backup/linkage marker missing: $x"}
          }

          $shadow=Get-Content (Join-Path $root 'src/shadowBackup.js') -Raw
          foreach($x in @('tahalil-shadow-mirror','appVersionCode: 146',"appVersionName: 'Windows V146'",'Shadow backup is deliberately non-blocking')){
            if(!$shadow.Contains($x)){throw "Shadow marker missing: $x"}
          }

          $main=Get-Content (Join-Path $root 'electron/main.cjs') -Raw
          foreach($x in @(
            'https://github.com/ahmedmeshrf96-bot/lab-tests-directory/releases/latest/download/latest-windows.json',
            "appVersionCode: 146, appVersionName: 'Windows V146'",
            "tray.setToolTip('تحاليل العقاد — Windows V146')",
            'MAX_WINDOWS_UPDATE_BYTES','downloadWindowsUpdate','sha256FileAsync','scheduleWindowsUpdateCheck',
            "FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-failover-read'",
            "RESULT_FAILOVER_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-result-failover'",
            "RECONCILE_ENDPOINT = 'https://ogidyelgmigcvasizzuv.supabase.co/functions/v1/tahalil-shadow-reconcile'",
            'OFFLINE_GRACE_MS = 72 * 60 * 60 * 1000','target.setHours(4,0,0,0)','safeStorage.encryptString',
            'setLoginItemSettings','new Tray','requestSingleInstanceLock','sandbox: true','contextIsolation: true',
            'nodeIntegration: false','webSecurity: true','setContentProtection(false)'
          )){if(!$main.Contains($x)){throw "Windows V145 preservation marker missing after V146 patch: $x"}}
          if($main.Contains('setContentProtection(true)')){throw 'Screenshot blocking reappeared'}

          $firebase=Get-Content (Join-Path $root 'src/firebase.js') -Raw
          foreach($x in @('tahalil-alakkad','1:266327573884:web:c457f66f054582bb4290f9')){
            if(!$firebase.Contains($x)){throw "Firebase linkage marker missing: $x"}
          }

          $all=@('src/app.js','src/data.js','src/backup.js','src/shadowBackup.js','src/failover.js','src/resultFailover.js','src/shadowReconcile.js','electron/main.cjs','electron/preload.cjs')
          $combined=($all | ForEach-Object {Get-Content (Join-Path $root $_) -Raw}) -join "`n"
          $low=$combined.ToLowerInvariant()
          if($low.Contains('cloudflare') -or $low.Contains('workers.dev')){throw 'Cloudflare dependency detected'}
          foreach($secret in @('SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEYS','sb_secret_','BEGIN PRIVATE KEY')){
            if($combined.Contains($secret)){throw "Forbidden secret marker: $secret"}
          }
          Write-Host 'WINDOWS V146 <-> ANDROID V144 R3 LINKAGE + NO-RELOCK AUDIT PASSED'

      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'build_v146_windows/windows-system'
          Get-ChildItem (Join-Path $root 'src') -Filter '*.js' -File | ForEach-Object {
            Get-Content $_.FullName -Raw | node --input-type=module --check
            if($LASTEXITCODE -ne 0){throw "JS syntax failed: $($_.Name)"}
          }
          node --check (Join-Path $root 'electron/main.cjs')
          if($LASTEXITCODE -ne 0){throw 'main.cjs syntax failed'}
          node --check (Join-Path $root 'electron/preload.cjs')
          if($LASTEXITCODE -ne 0){throw 'preload.cjs syntax failed'}

      - name: Snapshot V146 source before dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path v146-source.zip){Remove-Item v146-source.zip -Force}
          Compress-Archive -Path 'build_v146_windows/windows-system' -DestinationPath v146-source.zip -CompressionLevel Optimal
          if(!(Test-Path v146-source.zip)){throw 'V146 source archive missing'}

      - name: Install dependencies
        working-directory: build_v146_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'npm install failed'}

      - name: Build Portable
        working-directory: build_v146_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run dist:portable
          if($LASTEXITCODE -ne 0){throw 'Portable build failed'}

      - name: Portable startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v146_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if(!$exe){throw 'Portable EXE missing'}
          $env:TAHALIL_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if(!$p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force;throw 'Portable smoke timed out'}
          if($p.ExitCode -ne 0){throw "Portable smoke exit code $($p.ExitCode)"}
          Remove-Item Env:TAHALIL_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: System Tray smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v146_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if(!$exe){throw 'Portable EXE missing'}
          $env:TAHALIL_TRAY_SMOKE_TEST='1'
          $p=Start-Process $exe.FullName -PassThru
          if(!$p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force;throw 'Tray smoke timed out'}
          if($p.ExitCode -ne 0){throw "Tray smoke exit code $($p.ExitCode)"}
          Remove-Item Env:TAHALIL_TRAY_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: Background startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v146_windows/windows-system/release'
          $exe=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $p=Start-Process $exe.FullName -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 5
          if($p.HasExited){throw "Background startup exited with $($p.ExitCode)"}
          Stop-Process -Id $p.Id -Force

      - name: Build Setup
        working-directory: build_v146_windows/windows-system
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run dist:setup
          if($LASTEXITCODE -ne 0){throw 'Setup build failed'}

      - name: Prepare V146 delivery and update manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Join-Path $PWD 'build_v146_windows/windows-system/release'
          $portable=Get-ChildItem $release -Filter '*Portable*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $setup=Get-ChildItem $release -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if(!$portable -or !$setup){throw 'Setup/Portable missing'}
          Copy-Item $portable.FullName 'Tahalil-Alakkad-V146-Windows-Portable.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-V146-Windows-Setup.exe' -Force
          Copy-Item $setup.FullName 'Tahalil-Alakkad-Windows-LATEST-Setup.exe' -Force
          Copy-Item v146-source.zip 'Tahalil-Alakkad-V146-Windows-SOURCE.zip' -Force
          foreach($name in @('Tahalil-Alakkad-V146-Windows-Portable.exe','Tahalil-Alakkad-V146-Windows-Setup.exe','Tahalil-Alakkad-Windows-LATEST-Setup.exe','Tahalil-Alakkad-V146-Windows-SOURCE.zip')){
            $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }
          $setupSha=(Get-FileHash 'Tahalil-Alakkad-V146-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            versionCode=146
            versionName='Windows V146 Android V144 R3 Full Parity No Re-Lock'
            setupUrl='https://github.com/ahmedmeshrf96-bot/lab-tests-directory/releases/download/v146-windows/Tahalil-Alakkad-V146-Windows-Setup.exe'
            sha256=$setupSha
            mandatory=$true
          }
          $manifest | ConvertTo-Json | Set-Content latest-windows.json -Encoding utf8

      - name: Upload V146 delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahalil-Alakkad-Windows-V146-ANDROID-V144-R3-NO-RELOCK
          path: |
            Tahalil-Alakkad-V146-Windows-Portable.exe
            Tahalil-Alakkad-V146-Windows-Portable.exe.sha256
            Tahalil-Alakkad-V146-Windows-Setup.exe
            Tahalil-Alakkad-V146-Windows-Setup.exe.sha256
            Tahalil-Alakkad-Windows-LATEST-Setup.exe
            Tahalil-Alakkad-Windows-LATEST-Setup.exe.sha256
            Tahalil-Alakkad-V146-Windows-SOURCE.zip
            Tahalil-Alakkad-V146-Windows-SOURCE.zip.sha256
            latest-windows.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows V146 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v146-windows'
          $headers=@{
            Accept='application/vnd.github+json'
            Authorization="Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='Tahalil-Windows-V146-Publish'
          }
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $response=Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          $status=[int]$response.StatusCode
          if($status -eq 200){throw 'Release v146-windows already exists; refusing overwrite'}
          if($status -ne 404){throw "Could not verify release destination before publish; GitHub API HTTP $status"}
          gh release create $tag `
            'Tahalil-Alakkad-V146-Windows-Portable.exe' `
            'Tahalil-Alakkad-V146-Windows-Portable.exe.sha256' `
            'Tahalil-Alakkad-V146-Windows-Setup.exe' `
            'Tahalil-Alakkad-V146-Windows-Setup.exe.sha256' `
            'Tahalil-Alakkad-Windows-LATEST-Setup.exe' `
            'Tahalil-Alakkad-Windows-LATEST-Setup.exe.sha256' `
            'Tahalil-Alakkad-V146-Windows-SOURCE.zip' `
            'Tahalil-Alakkad-V146-Windows-SOURCE.zip.sha256' `
            'latest-windows.json' `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "تحاليل العقاد Windows V146 — Android V144 R3 Full Parity / No Re-Lock" `
            --notes "Built from exact public Windows V145 source and exact Android V144 R3 baseline. Windows now mirrors the latest Android session behavior: returning from background does not trigger the secondary local app PIN lock. Automatic inactivity/blur/background app re-lock is disabled; explicit account Logout is unchanged; manager/admin elevation still locks on background. Android V144 331-test catalogue/search aliases are copied exactly. Shared Firebase catalogue/prices/orders/results, encrypted backup, Supabase failover/reconciliation, offline mode, screenshots, tray, updater and Electron hardening are preserved." `
            --latest
          if($LASTEXITCODE -ne 0){throw 'V146 release create failed'}

      - name: Verify V146 public update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 3
          $url="https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest-windows.json"
          curl.exe --fail --location --retry 3 $url -o public-latest-windows.json
          if($LASTEXITCODE -ne 0){throw 'Could not download public latest-windows.json'}
          $m=Get-Content public-latest-windows.json -Raw | ConvertFrom-Json
          if($m.versionCode -ne 146){throw "Public channel version is $($m.versionCode), expected 146"}
          if($m.versionName -ne 'Windows V146 Android V144 R3 Full Parity No Re-Lock'){throw 'Public versionName mismatch'}
          if($m.mandatory -ne $true){throw 'Public update must be mandatory'}
          $localSha=(Get-FileHash 'Tahalil-Alakkad-V146-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($m.sha256 -ne $localSha){throw 'Public SHA256 mismatch'}
          $assets=gh release view v146-windows --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          if($LASTEXITCODE -ne 0){throw 'Could not read V146 release assets'}
          foreach($needed in @('Tahalil-Alakkad-V146-Windows-Setup.exe','Tahalil-Alakkad-V146-Windows-Portable.exe','Tahalil-Alakkad-V146-Windows-SOURCE.zip','latest-windows.json')){
            if($assets -notcontains $needed){throw "Missing release asset: $needed"}
          }
          Write-Host 'WINDOWS V146 PUBLIC CHANNEL VERIFIED'

      - name: Final status
        shell: pwsh
        run: Write-Host 'WINDOWS V146 <-> ANDROID V144 R3 FULL PARITY + NO AUTO RE-LOCK BUILT, AUDITED, SMOKE-TESTED, RELEASED AND VERIFIED'
